{% extends "securityaudit/base.html" %}
{% block securityaudit_content %}
<div class="card">
    <div class="card-header">
        <h4 class="mb-0">Add Financial Exception</h4>
    </div>
    <div class="card-body">
        <form method="post" class="row g-3">
            {% csrf_token %}
            {% for field in form %}
            <div class="col-12">
                <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <div class="text-danger small mt-1">{{ field.errors|join:", " }}</div>
                {% endif %}
            </div>
            {% endfor %}
            <div class="col-12">
                <button type="submit" class="btn btn-primary">Create</button>
                <a href="{% url 'securityaudit:financial_exception_list' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
